<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EXPORT — environment prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #000;
    --fg: #f5f5f5;
    --card-border: #1b0202;
    --card-border-hover: #2d0505;
    --card-border-on: #360403;
    --seg-bg: #360403;
    --seg-active: #730907;
    --red: #ae0d0a;
    --red-hover: #cf100d;
    --dark: #140303;
    --zinc-300: #d4d4d8;
    --zinc-400: #a1a1aa;
    --zinc-500: #71717a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Rethink Sans', ui-sans-serif, system-ui, sans-serif;
    font-weight: 700;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  .modal {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 40px;
    overflow: hidden;
  }

  header { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  h1 { margin: 0; padding-left: 4px; font-size: 14px; font-weight: 900; letter-spacing: .22em; text-transform: uppercase; }
  .close {
    width: 28px; height: 28px; border-radius: 999px;
    background: var(--dark); color: var(--zinc-400);
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .close:hover { background: #250505; color: #fff; }
  .close svg { width: 14px; height: 14px; }

  main { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; padding: 0 8px; }
  .grid {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 24px; width: 100%; max-width: 1152px;
    height: calc(100vh - 170px); max-height: 560px;
  }
  .card {
    position: relative; border-radius: 28px; background: #000;
    border: 1px solid var(--card-border);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 12px 12px 20px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .card:hover { border-color: var(--card-border-hover); background: #080202; }
  .card.on { border-color: var(--card-border-on); }
  .card .frame {
    width: 100%; flex: 1; border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; padding: 16px; margin: auto 0;
    border: 1px solid transparent;
    transition: border-color .15s, box-shadow .15s;
  }
  .card.on .frame {
    border-color: var(--red);
    box-shadow: inset 0 0 24px rgba(174, 13, 10, .25);
  }
  .card img { width: 100%; height: 100%; object-fit: contain; opacity: .4; transition: opacity .15s; pointer-events: none; }
  .card.on img { opacity: 1; }
  .card .label {
    padding: 8px 32px; border-radius: 999px;
    font-size: 12px; letter-spacing: .025em; text-transform: lowercase;
    background: var(--seg-bg); color: var(--zinc-400);
    transition: background .15s, color .15s;
  }
  .card.on .label { background: var(--seg-active); color: #fff; }

  footer {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 24px;
  }
  .left { display: flex; align-items: center; gap: 14px; }
  .right { display: flex; align-items: center; gap: 16px; }

  /* resolution segmented group */
  .seg {
    position: relative; display: flex; align-items: center;
    background: var(--seg-bg); border-radius: 999px; padding: 4px;
  }
  .seg .indicator {
    position: absolute; top: 4px; bottom: 4px; left: 4px;
    border-radius: 999px; background: var(--seg-active);
    pointer-events: none;
    transition: transform .2s cubic-bezier(.2,.9,.2,1);
  }
  .seg button {
    position: relative; z-index: 1;
    padding: 8px 0; width: 88px; text-align: center;
    font-size: 12px; color: var(--zinc-300);
    transition: color .15s;
  }
  .seg button:hover, .seg button.on { color: #fff; }

  /* dropdown */
  .dd { position: relative; display: flex; align-items: center; gap: 10px; }
  .dd-label {
    font-size: 9px; font-weight: 800; letter-spacing: .22em;
    text-transform: uppercase; color: var(--zinc-500);
  }
  .dd-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px; border-radius: 999px;
    background: var(--seg-bg); font-size: 12px; color: #fff;
    transition: background .15s;
  }
  .dd-btn:hover { background: #4a0604; }
  .dd-btn .val { text-transform: lowercase; font-weight: 700; }
  .dd-btn svg { width: 14px; height: 14px; color: var(--zinc-300); transition: transform .2s; }
  .dd.open .dd-btn svg { transform: rotate(180deg); }
  .dd-menu {
    position: absolute; left: 0; bottom: calc(100% + 8px);
    min-width: 150px; padding: 6px;
    border-radius: 16px; background: var(--dark);
    border: 1px solid var(--seg-bg);
    display: none; flex-direction: column; gap: 4px; z-index: 30;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .6);
  }
  .dd.open .dd-menu { display: flex; }
  .dd-menu button {
    display: flex; align-items: center; gap: 8px;
    text-align: left; padding: 7px 12px; border-radius: 12px;
    font-size: 12px; font-weight: 700; color: var(--zinc-300);
    text-transform: lowercase;
    transition: background .15s, color .15s;
  }
  .dd-menu button:hover { background: rgba(115, 9, 7, .4); color: #fff; }
  .dd-menu button.on { background: var(--seg-active); color: #fff; }
  .dot { width: 7px; height: 7px; border-radius: 999px; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }

  /* env dimmed when beauty not selected */
  .env { display: flex; align-items: center; gap: 14px; transition: opacity .2s; }
  .env.dim { opacity: .35; pointer-events: none; }

  .cam .dd-menu { left: auto; right: 0; }

  .export {
    min-width: 120px; height: 38px; padding: 0 32px;
    border-radius: 999px; background: var(--red); color: #fff;
    font-size: 12px; letter-spacing: .05em; text-transform: uppercase;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .08s;
  }
  .export:hover { background: var(--red-hover); }
  .export:active { transform: scale(.95); }

  .note {
    position: fixed; left: 40px; bottom: 6px;
    font-size: 10px; font-weight: 500; letter-spacing: .08em;
    color: #3a2222;
  }
</style>
</head>
<body>
<div class="modal">
  <header>
    <h1>EXPORT</h1>
    <button class="close" title="Close (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>

  <main>
    <div class="grid" id="passGrid">
      <div class="card on" data-pass="beauty">
        <div class="frame"><img src="../src/assets/passes/pass-beauty.png" alt="beauty pass" /></div>
        <div class="label">beauty</div>
      </div>
      <div class="card" data-pass="wem">
        <div class="frame"><img src="../src/assets/passes/pass-wem-mask.png" alt="wem pass" /></div>
        <div class="label">wem</div>
      </div>
      <div class="card" data-pass="normal">
        <div class="frame"><img src="../src/assets/passes/pass-normal.png" alt="normal pass" /></div>
        <div class="label">normal</div>
      </div>
      <div class="card" data-pass="clown">
        <div class="frame"><img src="../src/assets/passes/pass-clown-id.png" alt="clown pass" /></div>
        <div class="label">clown</div>
      </div>
    </div>
  </main>

  <footer>
    <div class="left">
      <div class="seg" id="resSeg">
        <div class="indicator" id="resInd" style="width:88px"></div>
        <button class="on" data-res="1080p">1080p</button>
        <button data-res="2k">2k</button>
        <button data-res="4k">4k</button>
      </div>

      <!-- per-export environment, dropdowns -->
      <div class="env" id="env">
        <div class="dd" id="skyDD">
          <span class="dd-label">Sky</span>
          <button class="dd-btn">
            <span class="val" id="skyVal">black</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="dd-menu" id="skyMenu">
            <button data-sky="studio"><i class="dot" style="background:#3b1d30"></i>studio</button>
            <button data-sky="sunset"><i class="dot" style="background:#ff7a3a"></i>sunset</button>
            <button data-sky="night"><i class="dot" style="background:#12203f"></i>night</button>
            <button class="on" data-sky="black"><i class="dot" style="background:#000"></i>black</button>
          </div>
        </div>

        <div class="dd" id="groundDD">
          <span class="dd-label">Ground</span>
          <button class="dd-btn">
            <span class="val" id="groundVal">off</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="dd-menu" id="groundMenu">
            <button data-ground="shadow">shadow</button>
            <button data-ground="grass">grass</button>
            <button class="on" data-ground="off">off</button>
          </div>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="dd cam" id="camDD">
        <button class="dd-btn">
          <span class="val" id="camVal">camera 1</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="dd-menu" id="camMenu">
          <button data-cam="viewport">viewport</button>
          <button class="on" data-cam="camera 1">camera 1</button>
        </div>
      </div>
      <button class="export" id="exportBtn">EXPORT</button>
    </div>
  </footer>
</div>

<div class="note">prototype — sky/ground apply to export only</div>

<script>
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => [...document.querySelectorAll(s)];

  // ---- resolution
  const resInd = $('#resInd');
  const RES_X = { '1080p': 0, '2k': 88, '4k': 176 };
  function setRes(res) {
    $$('#resSeg button').forEach(b => b.classList.toggle('on', b.dataset.res === res));
    resInd.style.transform = `translateX(${RES_X[res]}px)`;
  }
  $$('#resSeg button').forEach(b => b.onclick = () => setRes(b.dataset.res));

  // ---- passes
  function syncEnvDim() {
    const beautyOn = $('.card[data-pass="beauty"]').classList.contains('on');
    $('#env').classList.toggle('dim', !beautyOn);
  }
  $$('.card').forEach(card => card.onclick = () => {
    card.classList.toggle('on');
    if ($$('.card.on').length === 0) card.classList.add('on'); // keep >= 1
    syncEnvDim();
  });

  // ---- generic dropdown wiring (single-open)
  function wireDropdown(id, valueEl, dataKey, onPick) {
    const root = document.getElementById(id);
    const btn = root.querySelector('.dd-btn');
    const menu = root.querySelector('.dd-menu');
    btn.onclick = (e) => {
      e.stopPropagation();
      const wasOpen = root.classList.contains('open');
      closeAllDropdowns();
      if (!wasOpen) root.classList.add('open');
    };
    menu.onclick = (e) => e.stopPropagation();
    $$(`#${menu.id} button`).forEach(b => b.onclick = () => {
      $$(`#${menu.id} button`).forEach(x => x.classList.toggle('on', x === b));
      valueEl.textContent = b.dataset[dataKey];
      root.classList.remove('open');
      if (onPick) onPick(b);
    });
  }
  function closeAllDropdowns() {
    $$('.dd.open').forEach(el => el.classList.remove('open'));
  }
  document.addEventListener('click', closeAllDropdowns);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllDropdowns(); });

  wireDropdown('skyDD', $('#skyVal'), 'sky');
  wireDropdown('groundDD', $('#groundVal'), 'ground');
  wireDropdown('camDD', $('#camVal'), 'cam');

  // ---- export feedback
  const exportBtn = $('#exportBtn');
  exportBtn.onclick = () => {
    const passes = $$('.card.on').map(c => c.dataset.pass).join('+');
    const res = $('#resSeg button.on').dataset.res;
    const sky = $('#skyVal').textContent;
    const ground = $('#groundVal').textContent;
    const cam = $('#camVal').textContent;
    console.log('export', { passes, res, sky, ground, cam });
    exportBtn.textContent = '✓';
    setTimeout(() => (exportBtn.textContent = 'EXPORT'), 900);
  };

  syncEnvDim();
</script>
</body>
</html>
